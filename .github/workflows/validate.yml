name: Validate index.html

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
  pull_request:
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
  workflow_dispatch:

jobs:
  w3c-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: W3C HTML validation
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .

  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          # linkedin.com, fiverr.com, upwork.com block non-browser requests
          # (403/999) regardless of link validity, so they're excluded rather
          # than checked. Self-referential absolute URLs (canonical, og:url,
          # og:image, twitter:image) are remapped to the checked-out repo so
          # they're verified against real files instead of racing GitHub
          # Pages' deploy.
          args: >-
            --no-progress
            --exclude "linkedin\.com"
            --exclude "fiverr\.com"
            --exclude "upwork\.com"
            --remap "https://pradedumo.github.io file://${{ github.workspace }}"
            index.html
          fail: true
